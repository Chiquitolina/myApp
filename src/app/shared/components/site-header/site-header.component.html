
<header class="site-header d-flex justify-content-between
               align-items-start align-items-md-center">

  <!-- IZQUIERDA: LOGO (50% EN MOBILE) -->
  <a routerLink="/"
     class="brand col-6 col-md-auto d-flex align-items-center border-none"
     aria-label="AG / Portfolio — Inicio">

    <img
      src="/favicon.ico"
      alt="AG"
      class="brand-logo"
      width="37"
      height="32"
    />

    <span>/ Portfolio</span>
  </a>

  <!-- DERECHA: NAVEGACIÓN Y PREFERENCIAS -->
  <div class="header-actions col-6 col-md-auto
              d-flex flex-column-reverse flex-md-row
              align-items-end align-items-md-center
              gap-2 gap-md-3">

    <!-- NAVEGACIÓN: DEBAJO EN MOBILE -->
    <nav class="main-nav d-flex align-items-center
                justify-content-end gap-2 gap-md-3"
         aria-label="Navegación principal">

      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page">
        {{ labels.home }}
      </a>

      <a routerLink="/portfolio"
         routerLinkActive="active"
         ariaCurrentWhenActive="page">
        {{ labels.portfolio }}
      </a>
    </nav>

    <!-- PREFERENCIAS: ARRIBA EN MOBILE -->
    <div class="header-preferences d-flex
                flex-row align-items-center
                justify-content-end gap-2">

      <button class="theme-button"
              type="button"
              (click)="toggleTheme()"
              [attr.aria-label]="labels.theme"
              [attr.title]="labels.theme">

        @if (dark) {
          <span aria-hidden="true">☾</span>
        } @else {
          <span aria-hidden="true">☼</span>
        }
      </button>

      <div class="language-control"
           role="group"
           [attr.aria-label]="labels.language">

        <button type="button"
                [class.selected]="language === 'en'"
                [attr.aria-pressed]="language === 'en'"
                (click)="changeLanguage('en')">
          EN
        </button>

        <button type="button"
                [class.selected]="language === 'es'"
                [attr.aria-pressed]="language === 'es'"
                (click)="changeLanguage('es')">
          ES
        </button>
      </div>

    </div>
  </div>
</header>
