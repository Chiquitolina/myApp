<header class="site-header d-flex justify-content-between
               align-items-start align-items-md-center">

  <a routerLink="/" class="brand"
     aria-label="AG / Portfolio — Inicio">
    AG <span>/ Portfolio</span>
  </a>

  <div class="header-actions d-flex flex-column-reverse
              flex-md-row align-items-end
              align-items-md-center gap-3">

    <nav class="main-nav d-flex gap-3 border-none"
         aria-label="Navegación principal">
      <a routerLink="/"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }"
         ariaCurrentWhenActive="page">
        {{ labels.home }}
      </a>

      <a routerLink="/portfolio"
         routerLinkActive="active"
         ariaCurrentWhenActive="page">
        {{ labels.portfolio }}
      </a>
    </nav>

    <div class="header-preferences d-flex
                flex-row align-items-center gap-2">

      <button class="theme-button" type="button"
              (click)="toggleTheme()"
              [attr.aria-label]="labels.theme"
              [attr.title]="labels.theme">
        @if (dark) {
          <span aria-hidden="true">☾</span>
        } @else {
          <span aria-hidden="true">☼</span>
        }
      </button>

      <div class="language-control" role="group"
           [attr.aria-label]="labels.language">
        <button type="button"
                [class.selected]="language === 'en'"
                (click)="changeLanguage('en')">EN</button>
        <button type="button"
                [class.selected]="language === 'es'"
                (click)="changeLanguage('es')">ES</button>
      </div>

    </div>
  </div>
</header>
