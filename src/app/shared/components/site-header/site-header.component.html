
<header class="site-header border-none">

  <!-- LOGO Y TÍTULO -->
  <a
    routerLink="/"
    class="brand"
    aria-label="Ir al Inicio"
  >
    <img
      src="/favicon.ico"
      alt=""
      class="brand-logo"
      width="37"
      height="32"
    />

    <span class="brand-title">
      / Software Developer - Researcher
    </span>
  </a>

  <!-- NAVEGACIÓN Y PREFERENCIAS -->
  <div class="header-actions">

    <!-- NAVEGACIÓN -->
    <nav class="main-nav"
         aria-label="Navegación principal">

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page">
        {{ labels.home }}
      </a>

      <a
        routerLink="/portfolio"
        routerLinkActive="active"
        ariaCurrentWhenActive="page">
        {{ labels.portfolio }}
      </a>

    </nav>

    <!-- TEMA E IDIOMA -->
    <div class="header-preferences">

      <button
        class="theme-button"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="labels.theme"
        [attr.title]="labels.theme">

        @if (dark) {
          <span aria-hidden="true">☾</span>
        } @else {
          <span aria-hidden="true">☼</span>
        }

      </button>

      <div
        class="language-control"
        role="group"
        [attr.aria-label]="labels.language">

        <button
          type="button"
          [class.selected]="language === 'en'"
          [attr.aria-pressed]="language === 'en'"
          (click)="changeLanguage('en')">
          EN
        </button>

        <button
          type="button"
          [class.selected]="language === 'es'"
          [attr.aria-pressed]="language === 'es'"
          (click)="changeLanguage('es')">
          ES
        </button>

      </div>

    </div>

  </div>

</header>
